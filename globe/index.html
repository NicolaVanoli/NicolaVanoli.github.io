<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/globe/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>3D Globe — Antipode Game</title>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 100%; height: 100%; overflow: hidden; background: #000; }
      canvas { display: block; }

      .top-buttons {
        position: fixed;
        top: 16px;
        right: 16px;
        z-index: 100;
        display: flex;
        gap: 8px;
      }

      .top-btn {
        padding: 10px 18px;
        border: 2px solid rgba(255,255,255,0.3);
        border-radius: 8px;
        background: rgba(0,0,0,0.6);
        color: #fff;
        font-family: system-ui, sans-serif;
        font-size: 14px;
        cursor: pointer;
        backdrop-filter: blur(8px);
        transition: all 0.2s ease;
      }
      .top-btn:hover { background: rgba(255,255,255,0.15); border-color: rgba(255,255,255,0.5); }
      .top-btn.active { border-color: #ff4444; color: #ff4444; }
      .top-btn:disabled { opacity: 0.4; cursor: default; }

      #gesture-btn { /* inherits from .top-btn */ }
      #reset-btn { display: none; }
      #reset-btn.visible { display: block; }

      #webcam-container {
        position: fixed;
        bottom: 16px;
        right: 16px;
        z-index: 100;
        display: none;
        border-radius: 8px;
        overflow: hidden;
        border: 2px solid rgba(255,255,255,0.2);
        box-shadow: 0 4px 20px rgba(0,0,0,0.5);
      }
      #webcam-container.visible { display: block; }
      #webcam-video {
        width: 240px;
        height: 180px;
        object-fit: cover;
        transform: scaleX(-1);
      }

      #info-label {
        position: fixed;
        bottom: 16px;
        left: 16px;
        z-index: 100;
        color: rgba(255,255,255,0.5);
        font-family: system-ui, sans-serif;
        font-size: 12px;
        pointer-events: none;
      }

      #coords-label {
        position: fixed;
        top: 16px;
        left: 16px;
        z-index: 100;
        color: rgba(255,255,255,0.7);
        font-family: 'SF Mono', 'Fira Code', monospace;
        font-size: 13px;
        pointer-events: none;
        background: rgba(0,0,0,0.5);
        padding: 8px 12px;
        border-radius: 6px;
        display: none;
        backdrop-filter: blur(8px);
      }
      #coords-label.visible { display: block; }

      /* ─── Game UI ─── */
      #game-overlay {
        position: fixed;
        inset: 0;
        z-index: 200;
        pointer-events: none;
        font-family: system-ui, -apple-system, sans-serif;
      }
      #game-overlay * { pointer-events: auto; }

      #play-btn {
        position: fixed;
        bottom: 48px;
        left: 50%;
        transform: translateX(-50%);
        padding: 14px 36px;
        font-size: 18px;
        font-weight: 600;
        color: #fff;
        background: linear-gradient(135deg, #ff6b35, #f7931e);
        border: none;
        border-radius: 12px;
        cursor: pointer;
        box-shadow: 0 4px 24px rgba(255,107,53,0.4);
        transition: all 0.25s ease;
        z-index: 201;
      }
      #play-btn:hover { transform: translateX(-50%) scale(1.05); box-shadow: 0 6px 32px rgba(255,107,53,0.6); }
      #play-btn.hidden { display: none; }

      #game-hud {
        position: fixed;
        top: 16px;
        left: 50%;
        transform: translateX(-50%);
        z-index: 201;
        display: none;
        flex-direction: column;
        align-items: center;
        gap: 8px;
      }
      #game-hud.visible { display: flex; }

      .game-badge {
        background: rgba(0,0,0,0.7);
        backdrop-filter: blur(12px);
        border: 1px solid rgba(255,255,255,0.15);
        border-radius: 10px;
        padding: 10px 20px;
        color: #fff;
        font-size: 14px;
        text-align: center;
        line-height: 1.5;
      }

      #game-instruction {
        font-size: 15px;
        max-width: 420px;
      }

      #game-score-badge {
        font-size: 16px;
        font-weight: 600;
      }

      #game-bottom-bar {
        position: fixed;
        bottom: 48px;
        left: 50%;
        transform: translateX(-50%);
        z-index: 201;
        display: none;
        gap: 12px;
        align-items: center;
      }
      #game-bottom-bar.visible { display: flex; }

      .game-btn {
        padding: 12px 28px;
        font-size: 15px;
        font-weight: 600;
        color: #fff;
        border: none;
        border-radius: 10px;
        cursor: pointer;
        transition: all 0.2s ease;
      }
      .game-btn:hover { transform: scale(1.04); }

      #confirm-btn {
        background: linear-gradient(135deg, #00c853, #009624);
        box-shadow: 0 4px 16px rgba(0,200,83,0.3);
        display: none;
      }
      #confirm-btn.visible { display: block; }

      #next-btn {
        background: linear-gradient(135deg, #2196f3, #1565c0);
        box-shadow: 0 4px 16px rgba(33,150,243,0.3);
        display: none;
      }
      #next-btn.visible { display: block; }

      #end-btn {
        background: linear-gradient(135deg, #ff5252, #c62828);
        box-shadow: 0 4px 16px rgba(255,82,82,0.3);
        display: none;
      }
      #end-btn.visible { display: block; }

      /* Score popup animation */
      .score-popup {
        position: fixed;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%) scale(0.5);
        z-index: 300;
        font-size: 64px;
        font-weight: 800;
        color: #fff;
        text-shadow: 0 4px 32px rgba(255,107,53,0.6);
        opacity: 0;
        animation: scorePopIn 0.6s ease-out forwards;
        pointer-events: none;
        font-family: system-ui, -apple-system, sans-serif;
      }
      @keyframes scorePopIn {
        0% { transform: translate(-50%, -50%) scale(0.5); opacity: 0; }
        50% { transform: translate(-50%, -50%) scale(1.1); opacity: 1; }
        100% { transform: translate(-50%, -50%) scale(1); opacity: 1; }
      }
      .score-popup.fade-out {
        animation: scorePopOut 0.4s ease-in forwards;
      }
      @keyframes scorePopOut {
        to { transform: translate(-50%, -60%) scale(0.8); opacity: 0; }
      }

      /* Arc line between guess and true antipode */
      .game-arc-line { }

      /* Result detail panel */
      #result-panel {
        display: none;
        position: fixed;
        bottom: 120px;
        left: 50%;
        transform: translateX(-50%);
        z-index: 201;
        background: rgba(0,0,0,0.75);
        backdrop-filter: blur(12px);
        border: 1px solid rgba(255,255,255,0.15);
        border-radius: 12px;
        padding: 16px 24px;
        color: #fff;
        font-size: 13px;
        text-align: center;
        line-height: 1.7;
        font-family: 'SF Mono', 'Fira Code', monospace;
        min-width: 300px;
      }
      #result-panel.visible { display: block; }

      /* ─── Mobile / small-screen adjustments ─── */
      @media (max-width: 600px) {
        /* Top utility buttons: smaller, tighter */
        /* Top buttons: always on top, never covered */
        .top-buttons { top: 8px; right: 8px; gap: 4px; z-index: 110; }
        .top-btn { padding: 6px 10px; font-size: 12px; }

        /* Coords label: move below top buttons so it doesn't overlap */
        #coords-label {
          top: auto;
          bottom: 32px;
          left: 8px;
          right: 8px;
          width: auto;
          font-size: 11px;
          padding: 6px 10px;
          z-index: 99;
        }

        /* Play button */
        #play-btn { bottom: 24px; padding: 12px 24px; font-size: 15px; }

        /* HUD: push below top buttons, make narrower */
        #game-hud { top: 52px; width: calc(100% - 16px); }
        .game-badge { padding: 8px 12px; font-size: 12px; }
        #game-instruction { font-size: 13px; max-width: 100%; }
        #game-score-badge { font-size: 14px; }

        /* Bottom bar: stack vertically, pull up above safe area */
        #game-bottom-bar {
          bottom: 16px;
          flex-direction: column;
          gap: 8px;
          width: calc(100% - 32px);
        }
        .game-btn {
          padding: 10px 0;
          font-size: 14px;
          width: 100%;
          text-align: center;
        }

        /* Result panel: sit above the stacked buttons */
        #result-panel {
          bottom: auto;
          top: 50%;
          transform: translate(-50%, -50%);
          width: calc(100% - 32px);
          min-width: unset;
          padding: 12px 16px;
          font-size: 12px;
          line-height: 1.6;
        }

        /* Score popup: smaller so it doesn't fill the screen */
        .score-popup { font-size: 42px; }

        /* Webcam pip: smaller */
        #webcam-video { width: 160px; height: 120px; }
        #webcam-container { bottom: 8px; right: 8px; }

        /* Info label */
        #info-label { bottom: 8px; left: 8px; font-size: 10px; }
      }

      /* Extra-small screens (iPhone SE etc.) */
      @media (max-width: 380px) {
        .top-btn { padding: 5px 8px; font-size: 11px; }
        #coords-label { font-size: 10px; bottom: 28px; }
        #game-hud { top: 44px; }
        .game-badge { padding: 6px 8px; font-size: 11px; }
        #game-instruction { font-size: 12px; }
        .game-btn { padding: 9px 0; font-size: 13px; }
        #play-btn { padding: 10px 20px; font-size: 14px; }
      }
    </style>
    <script type="module" crossorigin src="/globe/assets/index-CYV2kj_z.js"></script>
  </head>
  <body>
    <div class="top-buttons">
      <button id="reset-btn" class="top-btn">🗑 Reset Points</button>
      <button id="gesture-btn" class="top-btn">🖐 Gesture Mode</button>
    </div>
    <div id="webcam-container">
      <video id="webcam-video" autoplay playsinline></video>
    </div>
    <div id="info-label">Click on the globe to place a point and its antipode</div>
    <div id="coords-label"></div>

    <!-- Game UI -->
    <div id="game-overlay">
      <div id="game-hud">
        <div id="game-score-badge" class="game-badge">Round <span id="round-num">1</span> / 5 &nbsp;•&nbsp; Score: <span id="total-score">0</span></div>
        <div id="game-instruction" class="game-badge">🌍 Find the antipode of the orange point!</div>
      </div>
      <div id="game-bottom-bar">
        <button id="confirm-btn" class="game-btn">✓ Confirm Guess</button>
        <button id="next-btn" class="game-btn">▶ Next Round</button>
        <button id="end-btn" class="game-btn">✕ End Game</button>
      </div>
      <div id="result-panel"></div>
    </div>
    <button id="play-btn">🌍 Play Antipode Game</button>

    <script src="/globe/assets/game.js"></script>
  </body>
</html>
