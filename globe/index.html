<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/globe/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>3D Globe</title>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 100%; height: 100%; overflow: hidden; background: #000; }
      canvas { display: block; }

      .top-buttons {
        position: fixed;
        top: 16px;
        right: 16px;
        z-index: 100;
        display: flex;
        gap: 8px;
      }

      .top-btn {
        padding: 10px 18px;
        border: 2px solid rgba(255,255,255,0.3);
        border-radius: 8px;
        background: rgba(0,0,0,0.6);
        color: #fff;
        font-family: system-ui, sans-serif;
        font-size: 14px;
        cursor: pointer;
        backdrop-filter: blur(8px);
        transition: all 0.2s ease;
      }
      .top-btn:hover { background: rgba(255,255,255,0.15); border-color: rgba(255,255,255,0.5); }
      .top-btn.active { border-color: #ff4444; color: #ff4444; }
      .top-btn:disabled { opacity: 0.4; cursor: default; }

      #gesture-btn {
        /* inherits from .top-btn */
      }
      #reset-btn {
        display: none;
      }
      #reset-btn.visible { display: block; }

      #webcam-container {
        position: fixed;
        bottom: 16px;
        right: 16px;
        z-index: 100;
        display: none;
        border-radius: 8px;
        overflow: hidden;
        border: 2px solid rgba(255,255,255,0.2);
        box-shadow: 0 4px 20px rgba(0,0,0,0.5);
      }
      #webcam-container.visible { display: block; }
      #webcam-video {
        width: 240px;
        height: 180px;
        object-fit: cover;
        transform: scaleX(-1);
      }

      #info-label {
        position: fixed;
        bottom: 16px;
        left: 16px;
        z-index: 100;
        color: rgba(255,255,255,0.5);
        font-family: system-ui, sans-serif;
        font-size: 12px;
        pointer-events: none;
      }

      #coords-label {
        position: fixed;
        top: 16px;
        left: 16px;
        z-index: 100;
        color: rgba(255,255,255,0.7);
        font-family: 'SF Mono', 'Fira Code', monospace;
        font-size: 13px;
        pointer-events: none;
        background: rgba(0,0,0,0.5);
        padding: 8px 12px;
        border-radius: 6px;
        display: none;
        backdrop-filter: blur(8px);
      }
      #coords-label.visible { display: block; }
    </style>
    <script type="module" crossorigin src="/globe/assets/index-CYV2kj_z.js"></script>
  </head>
  <body>
    <div class="top-buttons">
      <button id="reset-btn" class="top-btn">🗑 Reset Points</button>
      <button id="gesture-btn" class="top-btn">🖐 Gesture Mode</button>
    </div>
    <div id="webcam-container">
      <video id="webcam-video" autoplay playsinline></video>
    </div>
    <div id="info-label">Click on the globe to place a point and its antipode</div>
    <div id="coords-label"></div>
  </body>
</html>
